<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новое объявление</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/">Главная</a>
    <a href="/profile">Личный кабинет</a>
    <a href="/listings/new">Новое объявление</a>
    <a href="/chats" class="chats-link">
      Чаты
      <% if (typeof unreadCount !== 'undefined' && unreadCount > 0) { %>
        <span class="badge"><%= unreadCount %></span>
      <% } %>
    </a>
    <span class="navbar-right">
      <a href="/logout">Выйти</a>
    </span>
  </nav>
  <div class="container">
    <h1>Новое объявление</h1>
    <form method="POST" action="/listings/new" enctype="multipart/form-data">
      <label>Заголовок:<br><input type="text" name="title" required></label><br><br>
      <label>Описание:<br><textarea name="description" required></textarea></label><br><br>
      <label>Цена:<br><input type="number" name="price" step="0.01" required></label><br><br>
      <label>Адрес:<br><input type="text" name="address" required></label><br><br>
      <label>Фото:<br><input type="file" name="photo" accept="image/*"></label><br><br>
      <button type="submit">Создать</button>
    </form>
    <p><a href="/">Назад к списку</a></p>
  </div>
</body>
</html>
