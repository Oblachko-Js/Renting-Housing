<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/">Главная</a>
    <% if (typeof user !== 'undefined' && user) { %>
      <a href="/chats" class="chats-link">Чаты</a>
    <% } %>
    <span class="navbar-right">
      <a href="/login">Вход</a>
      <a href="/register">Регистрация</a>
    </span>
  </nav>
  <div class="container">
    <h1>Регистрация</h1>
    <form method="POST" action="/register">
      <label>Email (логин):<br><input type="email" name="email" required></label><br><br>
      <label>Имя (отображаемое):<br><input type="text" name="display_name"></label><br><br>
      <label>Пароль:<br><input type="password" name="password" required></label><br><br>
      <label>Роль:<br>
        <select name="role" required>
          <option value="tenant">Арендатор</option>
          <option value="landlord">Арендодатель</option>
        </select>
      </label><br><br>
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
  </div>
  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const e = params.get('error');
      if (e === 'exists') alert('Пользователь с таким email уже существует');
      if (e === 'missing') alert('Заполните все поля');
      if (e === 'bademail') alert('Введите корректный email');
      if (e === 'server') alert('Ошибка сервера, попробуйте позже');
    })();
  </script>
</body>
</html>
